name: Android APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm install
          python -m pip install --disable-pip-version-check pillow

      - name: Prepare supplied icon and splash
        run: python scripts/prepare_android_assets.py

      - name: Build web application
        run: npm run build

      - name: Create Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generate exact Android icon and splash screen
        run: |
          rm -f assets/icon-only.svg assets/splash.svg
          npm run android:assets

      - name: Force portrait mobile mode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          if 'android:screenOrientation=' not in text:
              text = re.sub(
                  r'(<activity\b[^>]*android:name="\.MainActivity")',
                  r'\1 android:screenOrientation="portrait"',
                  text,
                  count=1,
                  flags=re.S,
              )
          manifest.write_text(text, encoding="utf-8")
          print("Android portrait mode enabled")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikoWiko-Bakery-v2.4-boutique-personnalisable
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
